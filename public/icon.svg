<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="akBgGrad" cx="50%" cy="30%" r="75%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </radialGradient>

    <!-- Metallic Gradient for Architectural Pillar -->
    <linearGradient id="akPillarGrad" x1="140" y1="130" x2="230" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <!-- Precision Titanium Monochrome Gradient for Cantilever -->
    <linearGradient id="akKGrad" x1="240" y1="130" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="akGlow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32" result="blur"/>
    </filter>
  </defs>

  <!-- 1. Architectural Squircle Base -->
  <rect width="512" height="512" rx="96" fill="url(#akBgGrad)"/>
  
  <!-- Outer Hairline Engineering Border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="94.5" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Subtle Atmospheric Core Glow -->
  <circle cx="270" cy="250" r="110" fill="#ffffff" opacity="0.05" filter="url(#akGlow)"/>

  <!-- 2. Architectural Monogram: AN KHANG (A × K Ligature) -->
  <g id="ak-emblem">
    <!-- Left Architectural Pillar: Structural Pillar & A-Ascender (45° Chamfer) -->
    <path
      d="M140 180
         L180 140
         H224
         V348
         C224 361.255 213.255 372 200 372
         H164
         C150.745 372 140 361.255 140 348
         V180Z"
      fill="url(#akPillarGrad)"
    />

    <!-- Right Dynamic Lintel & Upper K-Arm -->
    <path
      d="M256 140
         H348
         C361.255 140 372 150.745 372 164
         V248
         C372 261.255 361.255 272 348 272
         H304
         C290.745 272 280 261.255 280 248
         V196
         H256
         V140Z"
      fill="url(#akKGrad)"
    />

    <!-- Lower K-Arm: 45° Precision Cantilever Beam -->
    <path
      d="M280 288
         H336
         C349.255 288 360 298.745 360 312
         V348
         C360 361.255 349.255 372 336 372
         H256
         V312
         C256 298.745 266.745 288 280 288Z"
      fill="url(#akKGrad)"
    />

    <!-- Precision Central Engineering Diamond (Systems Coordinate Beacon) -->
    <path
      d="M248 240
         L264 256
         L248 272
         L232 256
         Z"
      fill="#ffffff"
    />
    <circle cx="248" cy="256" r="3.5" fill="#0c0c0e"/>
  </g>
</svg>
